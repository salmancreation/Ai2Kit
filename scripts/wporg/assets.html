<!doctype html>
<html><head><meta charset="utf-8"><style>
	* { margin: 0; box-sizing: border-box; }
	body { font-family: -apple-system, "Segoe UI", Inter, Roboto, sans-serif; }
	.icon { width: 256px; height: 256px; display: grid; place-items: center; background: linear-gradient(145deg, #7A5BFF 0%, #5A36EB 100%); }
	.banner { width: 1544px; height: 500px; position: relative; overflow: hidden; background: #11151C; color: #fff; display: flex; align-items: center; padding: 0 110px; gap: 72px; }
	.banner::before { content: ""; position: absolute; width: 900px; height: 900px; right: -220px; top: -260px; background: radial-gradient(circle, rgba(109,74,255,.55) 0%, rgba(109,74,255,0) 65%); }
	.mark { width: 200px; height: 200px; flex: none; border-radius: 48px; display: grid; place-items: center; background: linear-gradient(145deg, #7A5BFF 0%, #5A36EB 100%); box-shadow: 0 30px 80px -20px rgba(109,74,255,.7); position: relative; }
	.copy { position: relative; }
	.name { font-size: 104px; font-weight: 800; letter-spacing: -3px; line-height: 1; }
	.tag { margin-top: 26px; font-size: 40px; font-weight: 500; color: #C9C2FF; letter-spacing: -.5px; }
	.chips { margin-top: 34px; display: flex; gap: 14px; }
	.chip { font-size: 24px; font-weight: 600; padding: 10px 22px; border-radius: 999px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.14); color: #E6E0FF; }
</style></head><body>
<div class="icon" id="icon">
	<svg width="168" height="168" viewBox="0 0 20 20" fill="#fff"><rect x="1" y="1" width="10" height="10" rx="3"/><rect x="9" y="9" width="10" height="10" rx="3" fill-opacity=".55"/><path d="M11.5 4.5h3a1 1 0 0 1 1 1v3l-1.6-1.6-2.9 2.9-1.3-1.3 2.9-2.9z"/></svg>
</div>
<div class="banner" id="banner">
	<div class="mark"><svg width="132" height="132" viewBox="0 0 20 20" fill="#fff"><rect x="1" y="1" width="10" height="10" rx="3"/><rect x="9" y="9" width="10" height="10" rx="3" fill-opacity=".55"/><path d="M11.5 4.5h3a1 1 0 0 1 1 1v3l-1.6-1.6-2.9 2.9-1.3-1.3 2.9-2.9z"/></svg></div>
	<div class="copy">
		<div class="name">Ai2Kit</div>
		<div class="tag">AI-built websites → editable Elementor pages</div>
		<div class="chips"><span class="chip">Lovable</span><span class="chip">Bolt</span><span class="chip">v0</span><span class="chip">HTML</span><span class="chip">Claude · ChatGPT · Gemini</span></div>
	</div>
</div>
</body></html>
